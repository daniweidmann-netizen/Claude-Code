# Render Blueprint – kostenloses Hosting für TrueReel (Frontend + API + FFmpeg in einem Container)
# Einrichtung: render.com → New → Blueprint → dieses Repository wählen.
# Werte mit "sync: false" fragt Render beim Anlegen ab (geheime Schlüssel – nie ins Repo).
# ACHTUNG: Werte mit "value:" werden bei jedem Sync aus dieser Datei übernommen –
# Änderungen daran hier vornehmen, nicht im Render-Dashboard.
services:
  - type: web
    name: truereel
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/truereel-saas-webapp-v9szoj
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── Supabase ──────────────────────────────────────
      - key: SUPABASE_URL
        value: https://rocgdmpjiwytnsjgjpcj.supabase.co
      - key: SUPABASE_ANON_KEY   # öffentlicher Schlüssel (steht ohnehin im Browser)
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvY2dkbXBqaXd5dG5zamdqcGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMDE2OTEsImV4cCI6MjEwOTg3NzY5MX0.QMZ7wEcWyahQE9o27x5kLc7H4hBS6mwgyAjxUV3huWA
      - key: SUPABASE_SERVICE_ROLE_KEY   # GEHEIM: Supabase → Project Settings → API Keys → service_role
        sync: false
      # ── Stripe (Testmodus) ────────────────────────────
      - key: STRIPE_SECRET_KEY   # GEHEIM: sk_test_…
        sync: false
      - key: STRIPE_WEBHOOK_SECRET   # GEHEIM: whsec_… (nach dem ersten Deploy)
        sync: false
      - key: STRIPE_PRICE_HOBBY_MONTHLY
        value: price_1UajdDB41s0DKjW84WwAsBYp
      - key: STRIPE_PRICE_HOBBY_YEARLY
        value: price_1UajdEB41s0DKjW8mk5PlFSC
      - key: STRIPE_PRICE_DAILY_MONTHLY
        value: price_1UajdFB41s0DKjW8lzVGKG9T
      - key: STRIPE_PRICE_DAILY_YEARLY
        value: price_1UajdFB41s0DKjW8QqoN73yo
      - key: STRIPE_PRICE_PRO_MONTHLY
        value: price_1UajdGB41s0DKjW8WYS9QDGC
      - key: STRIPE_PRICE_PRO_YEARLY
        value: price_1UajdGB41s0DKjW8LzwNfa1E
      - key: STRIPE_PORTAL_CONFIG
        value: bpc_1UajdHB41s0DKjW8fpEVPmjF
      # ── Inhalte ───────────────────────────────────────
      - key: LLM_PROVIDER   # anthropic = KI-Skripte (ohne ANTHROPIC_API_KEY automatisch Mock)
        value: anthropic
      - key: ANTHROPIC_API_KEY   # GEHEIM: console.anthropic.com (sk-ant-…)
        sync: false
      - key: IMAGE_PROVIDER
        value: openai
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: OPENAI_IMAGE_QUALITY
        value: medium
      - key: PIXABAY_API_KEY   # pixabay.com/api/docs
        sync: false
      - key: TTS_PROVIDER
        value: openai
      - key: OPENAI_API_KEY   # GEHEIM: platform.openai.com/api-keys (sk-…)
        sync: false
      # ── Auto-Posting ──────────────────────────────────
      - key: GOOGLE_CLIENT_ID   # Google Cloud → OAuth-Client (YouTube)
        sync: false
      - key: GOOGLE_CLIENT_SECRET   # GEHEIM
        sync: false
      - key: YOUTUBE_PRIVACY   # private, bis Google die App geprüft hat; danach public
        value: private
      - key: STRIPE_AUTOMATIC_TAX   # true nur bei MWST-Pflicht (Stripe Tax kostet pro Zahlung)
        value: "false"
      - key: STATE_SECRET
        generateValue: true
